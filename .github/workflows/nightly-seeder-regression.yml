name: Nightly Seeder Regression

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  seeder-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run seeder regression test
        run: php artisan test tests/Feature/TimesheetSeederTest.php
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
