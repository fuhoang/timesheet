name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: timesheet_test
          MYSQL_USER: timesheet
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify CI env file
        run: test -f .env.ci

      - name: Prepare .env
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan storage:link || true
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: timesheet_test
          DB_USERNAME: timesheet
          DB_PASSWORD: secret
          APP_ENV: testing
          APP_DEBUG: false
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync

      - name: Run PHP tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: timesheet_test
          DB_USERNAME: timesheet
          DB_PASSWORD: secret
          APP_ENV: testing
          APP_DEBUG: false
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            ~/.cache/vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-vite-

      - name: Install Node dependencies
        run: npm ci

      - name: Run Frontend tests
        run: npm test -- --coverage
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      - name: Run UI snapshot and keyboard smoke tests
        run: |
          npm test -- resources/js/pages/Reports/__tests__/themeVisualRegression.test.jsx
          npm test -- resources/js/pages/__tests__/themeVisualRegression.core.test.jsx
          npm test -- resources/js/components/ui/__tests__/ConfirmActionModal.keyboard.test.jsx
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
